<body>
    <h1>CALCULADORA</h1>

        <form method="get" action="_PHP/soma.php">

                <option value="">SOMA</option>

            <br><br>
            <p>DIGITE O SEGUNDO NÚMERO</p>
            <input type="number" name="num2" id="num2" placeholder="..." required>
            <br><br>
            <input type="submit" name="CALCULAR" placeholder="CALCULAR" id="botao" value="CALCULAR">
        </form>
    </div>
</body>
</html>
